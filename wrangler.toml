name = "portfolio"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = "@astrojs/cloudflare/entrypoints/server"

# ADMIN_TOKEN is set via: pnpm exec wrangler secret put ADMIN_TOKEN

[[d1_databases]]
binding = "DB"
database_name = "portfolio"
database_id = "094909fb-d7ab-42a1-8459-aefdf118f45d"
migrations_dir = "migrations"

# Persist per-request logs (Workers Logs) so traffic spikes can be attributed
# to routes/user agents after the fact. Free tier keeps 200k events/day.
[observability]
enabled = true
